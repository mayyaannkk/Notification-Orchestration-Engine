version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: notif-postgres
    environment:
      POSTGRES_DB: notif_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: